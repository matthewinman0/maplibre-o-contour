<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Display a map</title>
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <script src="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/maplibre-contour@0.1.1/dist/index.min.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      var demSource = new mlcontour.DemSource({
        url: "https://tiles.mapterhorn.com/{z}/{x}/{y}.webp",
        encoding: "terrarium",
        maxzoom: 12,
      });

      // calls maplibregl.addProtocol for the shared cache and contour protocols
      demSource.setupMaplibre(maplibregl);

      var map = new maplibregl.Map({
        container: "map",
        zoom: 12.55,
        center: [86.92731, 27.97797],
        hash: true,
        style: {
          version: 8,
          sources: {
            dem: {
              type: "raster-dem",
              encoding: "terrarium",
              tiles: [demSource.sharedDemProtocolUrl], // share cached DEM tiles with contour layer
              maxzoom: 12,
              tileSize: 256,
            },
            contours: {
              type: "vector",
              tiles: [
                demSource.contourProtocolUrl({
                  multiplier: 1,
                  thresholds: {
                    // zoom: [minor, major]
                    11: [5, 20],
                    12: [5, 20],
                    13: [5, 20],
                    14: [5, 20],
                    15: [5, 20],
                  },
                  elevationKey: "ele",
                  levelKey: "level",
                  contourLayer: "contours",
                  overzoom: 1,
                }),
              ],
              maxzoom: 16,
            },
          },
          layers: [
            {
              id: "hills",
              type: "hillshade",
              source: "dem",
              paint: {
                "hillshade-exaggeration": 0.25,
              },
            },
            {
              id: "contours",
              type: "line",
              source: "contours",
              "source-layer": "contours",
              paint: {
                "line-color": "rgba(0,0,0, 50%)",
                "line-width": ["match", ["get", "level"], 1, 1, 0.5],
              },
              layout: {
                "line-join": "round",
              },
            },
          ],
        },
      });
    </script>
  </body>
</html>
